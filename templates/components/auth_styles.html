{# Estilos compartilhados das telas de login e recuperação de senha #}
<style>
/* ═══════════════════════════════════════════════════════════
   🎨 LOGIN PREMIUM 2025
   ═══════════════════════════════════════════════════════════ */

.login-page {
    min-height: calc(100vh - 200px);
    display: flex;
    align-items: center;
    background:
        radial-gradient(ellipse at 20% 10%, rgba(59, 178, 255, 0.1) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 90%, rgba(245, 158, 11, 0.08) 0%, transparent 50%),
        linear-gradient(180deg, #f8fafc 0%, #eef2f7 100%);
    position: relative;
    overflow: hidden;
}

/* ──────────────────────────────────────────────
   CARD
   ────────────────────────────────────────────── */
.login-card {
    background: #ffffff;
    border-radius: 24px;
    overflow: hidden;
    box-shadow:
        0 24px 60px -20px rgba(11, 43, 92, 0.25),
        0 8px 20px -8px rgba(0, 0, 0, 0.08);
    border: 1px solid rgba(11, 43, 92, 0.06);
    position: relative;
    animation: hs-login-in 0.6s cubic-bezier(0.4, 0, 0.2, 1);
}

@keyframes hs-login-in {
    from {
        opacity: 0;
        transform: translateY(24px) scale(0.98);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

/* ──────────────────────────────────────────────
   HEADER (gradiente azul)
   ────────────────────────────────────────────── */
.login-header {
    background: linear-gradient(135deg, #0b2b5c 0%, #14477a 45%, #1a6d8f 100%);
    padding: 2.25rem 1.75rem 2rem;
    text-align: center;
    position: relative;
    overflow: hidden;
}

.login-header-glow {
    position: absolute;
    top: -50%;
    right: -20%;
    width: 400px;
    height: 400px;
    background: radial-gradient(circle, rgba(59, 178, 255, 0.25) 0%, transparent 60%);
    pointer-events: none;
}

.login-header-glow::after {
    content: '';
    position: absolute;
    bottom: -100px;
    left: -100px;
    width: 300px;
    height: 300px;
    background: radial-gradient(circle, rgba(245, 158, 11, 0.15) 0%, transparent 70%);
}

.logo-icon {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1.5px solid rgba(255, 255, 255, 0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 1.25rem;
    position: relative;
    z-index: 1;
    box-shadow: 0 8px 24px -8px rgba(0, 0, 0, 0.4);
}

.logo-icon i {
    color: #ffffff;
    font-size: 1.75rem;
}

.login-title {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-weight: 800;
    font-size: 1.5rem;
    color: #ffffff;
    margin-bottom: 0.4rem;
    letter-spacing: -0.02em;
    position: relative;
    z-index: 1;
}

.login-subtitle {
    color: rgba(255, 255, 255, 0.72);
    font-size: 0.88rem;
    font-weight: 500;
    margin: 0;
    position: relative;
    z-index: 1;
}

/* ──────────────────────────────────────────────
   BODY
   ────────────────────────────────────────────── */
.login-body {
    padding: 2rem 1.75rem 1.75rem;
}

/* ──────────────────────────────────────────────
   BOTÕES SOCIAIS
   ────────────────────────────────────────────── */
.social-login {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
}

.btn-social {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 0.9rem 1.5rem;
    font-weight: 600;
    font-size: 0.95rem;
    border-radius: 100px;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    cursor: pointer;
    text-decoration: none;
    position: relative;
    overflow: hidden;
}

.btn-social i {
    font-size: 1.05rem;
}

.btn-social small {
    font-size: 0.72rem;
    opacity: 0.7;
    font-weight: 500;
}

/* Google */
.btn-google {
    background: #ffffff;
    color: #334155;
    border: 1.5px solid #e5e7eb;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
}

.btn-google i {
    color: #DB4437;
}

.btn-google:hover {
    background: #f8fafc;
    border-color: #cbd5e1;
    transform: translateY(-2px);
    box-shadow: 0 8px 20px -6px rgba(11, 43, 92, 0.1);
    color: #0b2b5c;
}

/* Facebook */
.btn-facebook {
    background: #1877F2;
    color: #ffffff;
    border: none;
    opacity: 0.5;
    cursor: not-allowed;
}

.btn-facebook i {
    color: #ffffff;
}

/* ──────────────────────────────────────────────
   DIVISOR
   ────────────────────────────────────────────── */
.divider {
    position: relative;
    text-align: center;
    margin: 1.5rem 0 1.25rem;
}

.divider::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 0;
    right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, #e2e8f0, transparent);
}

.divider-text {
    background: #ffffff;
    padding: 0 16px;
    position: relative;
    z-index: 1;
    font-size: 0.78rem;
    color: #94a3b8;
    font-weight: 500;
    letter-spacing: 0.02em;
}

/* ──────────────────────────────────────────────
   INPUTS
   ────────────────────────────────────────────── */
.input-group-modern {
    position: relative;
    margin-bottom: 1rem;
}

.input-icon {
    position: absolute;
    left: 18px;
    top: 50%;
    transform: translateY(-50%);
    z-index: 10;
    color: #94a3b8;
    font-size: 0.95rem;
    transition: color 0.25s ease;
    pointer-events: none;
}

.input-group-modern:focus-within .input-icon {
    color: #1a6d8f;
}

.input-group-modern .form-control {
    height: 52px;
    padding: 0 18px 0 48px;
    border: 1.5px solid #e5e7eb;
    border-radius: 14px;
    font-size: 0.95rem;
    font-weight: 500;
    background: #f8fafc;
    color: #0f172a;
    transition: all 0.25s ease;
    box-shadow: none;
}

.input-group-modern .form-control::placeholder {
    color: #94a3b8;
    font-weight: 400;
}

.input-group-modern .form-control:focus {
    border-color: #1a6d8f;
    background: #ffffff;
    box-shadow: 0 0 0 4px rgba(26, 109, 143, 0.12);
    outline: none;
}

/* Botão "olhinho" para mostrar/ocultar a senha */
.input-group-modern .form-control.com-olhinho {
    padding-right: 52px;
}

.senha-olhinho {
    position: absolute;
    right: 6px;
    top: 50%;
    transform: translateY(-50%);
    z-index: 10;
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 0;
    border-radius: 10px;
    background: transparent;
    color: #94a3b8;
    font-size: 0.95rem;
    cursor: pointer;
    transition: color 0.2s ease, background 0.2s ease;
}

.senha-olhinho:hover,
.senha-olhinho:focus-visible {
    color: #1a6d8f;
    background: rgba(26, 109, 143, 0.08);
    outline: none;
}

/* ──────────────────────────────────────────────
   LEMBRAR-ME + ESQUECEU SENHA
   ────────────────────────────────────────────── */
.login-options {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 1.25rem 0 1.5rem;
    flex-wrap: wrap;
    gap: 8px;
}

.login-options .form-check {
    margin: 0;
    padding-left: 1.75em;
    display: inline-flex;
    align-items: center;
}

.login-options .form-check-input {
    border: 1.5px solid #cbd5e1;
    cursor: pointer;
    margin-top: 0;
    transition: all 0.2s ease;
}

.login-options .form-check-input:checked {
    background-color: #0b2b5c;
    border-color: #0b2b5c;
}

.login-options .form-check-input:focus {
    box-shadow: 0 0 0 3px rgba(11, 43, 92, 0.15);
    border-color: #0b2b5c;
}

.login-options .form-check-label {
    font-size: 0.85rem;
    color: #475569;
    font-weight: 500;
    cursor: pointer;
    user-select: none;
}

.forgot-link {
    color: #64748b;
    text-decoration: none;
    font-size: 0.85rem;
    font-weight: 600;
    transition: color 0.2s ease;
}

.forgot-link:hover {
    color: #1a6d8f;
    text-decoration: underline;
}

/* ──────────────────────────────────────────────
   BOTÃO ENTRAR
   ────────────────────────────────────────────── */
.btn-login {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 1rem 1.75rem;
    background: linear-gradient(135deg, #0b2b5c 0%, #1a6d8f 100%);
    color: #ffffff;
    border: none;
    border-radius: 100px;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-weight: 700;
    font-size: 1rem;
    letter-spacing: -0.005em;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow:
        0 12px 28px -8px rgba(11, 43, 92, 0.5),
        inset 0 1px 0 rgba(255, 255, 255, 0.15);
}

.btn-login::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.25), transparent);
    transition: left 0.6s ease;
}

.btn-login:hover::before {
    left: 100%;
}

.btn-login:hover {
    transform: translateY(-3px);
    box-shadow:
        0 20px 40px -8px rgba(11, 43, 92, 0.6),
        inset 0 1px 0 rgba(255, 255, 255, 0.25);
}

.btn-login:active {
    transform: translateY(-1px);
}

.btn-login:disabled {
    opacity: 0.7;
    cursor: not-allowed;
    transform: none;
}

/* ──────────────────────────────────────────────
   PROMPT DE CADASTRO
   ────────────────────────────────────────────── */
.signup-prompt {
    text-align: center;
    margin-top: 1.5rem;
    padding-top: 0.5rem;
    color: #64748b;
    font-size: 0.9rem;
    font-weight: 500;
}

.signup-link {
    color: #1a6d8f;
    text-decoration: none;
    font-weight: 700;
    margin-left: 4px;
    transition: all 0.2s ease;
    display: inline-flex;
    align-items: center;
    gap: 4px;
}

.signup-link i {
    font-size: 0.75rem;
    transition: transform 0.25s ease;
}

.signup-link:hover {
    color: #0b2b5c;
}

.signup-link:hover i {
    transform: translateX(4px);
}

/* ──────────────────────────────────────────────
   SELOS DE CONFIANÇA
   ────────────────────────────────────────────── */
.login-trust {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 1rem 1.75rem;
    margin-top: 1.75rem;
    padding: 0 1rem;
}

.login-trust span {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.78rem;
    font-weight: 600;
    color: #64748b;
    letter-spacing: 0.01em;
}

.login-trust i {
    color: #10b981;
    font-size: 0.85rem;
}

/* ═══════════════════════════════════════════════════════════
   📱 RESPONSIVO
   ═══════════════════════════════════════════════════════════ */
@media (max-width: 768px) {
    .login-page {
        padding: 1rem 0 2rem;
        align-items: flex-start;
    }

    .login-header {
        padding: 1.75rem 1.25rem 1.5rem;
    }

    .logo-icon {
        width: 62px;
        height: 62px;
        margin-bottom: 1rem;
    }

    .logo-icon i {
        font-size: 1.5rem;
    }

    .login-title {
        font-size: 1.3rem;
    }

    .login-subtitle {
        font-size: 0.82rem;
    }

    .login-body {
        padding: 1.5rem 1.25rem 1.25rem;
    }

    .input-group-modern .form-control {
        height: 50px;
        font-size: 16px; /* evita zoom no iOS */
    }

    .btn-login {
        padding: 0.95rem 1.5rem;
        font-size: 0.95rem;
    }

    .btn-social {
        padding: 0.85rem 1.25rem;
        font-size: 0.9rem;
    }

    .login-trust {
        gap: 0.75rem 1.25rem;
        margin-top: 1.25rem;
    }

    .login-trust span {
        font-size: 0.72rem;
    }
}

/* ═══════════════════════════════════════════════════════════
   🔒 ACESSIBILIDADE
   ═══════════════════════════════════════════════════════════ */
@media (prefers-reduced-motion: reduce) {
    .login-card,
    .btn-social,
    .btn-login,
    .input-group-modern .form-control {
        animation: none !important;
        transition: none !important;
    }

    .btn-login::before {
        display: none;
    }
}
</style>

<script>
/* Olhinho: adiciona o botão de mostrar/ocultar em todos os campos de senha destas telas */
document.querySelectorAll('.input-group-modern input[type="password"]').forEach(function (campo) {
    const botao = document.createElement('button');
    botao.type = 'button';
    botao.className = 'senha-olhinho';
    botao.setAttribute('aria-label', 'Mostrar senha');
    botao.title = 'Mostrar senha';
    botao.innerHTML = '<i class="fas fa-eye"></i>';

    botao.addEventListener('click', function () {
        const mostrar = campo.type === 'password';
        campo.type = mostrar ? 'text' : 'password';
        botao.innerHTML = mostrar ? '<i class="fas fa-eye-slash"></i>' : '<i class="fas fa-eye"></i>';
        botao.setAttribute('aria-label', mostrar ? 'Ocultar senha' : 'Mostrar senha');
        botao.title = mostrar ? 'Ocultar senha' : 'Mostrar senha';
        campo.focus();
    });

    campo.classList.add('com-olhinho');
    campo.insertAdjacentElement('afterend', botao);

    // Ao enviar, a senha volta a ficar oculta (o navegador não a guarda como texto comum)
    campo.form?.addEventListener('submit', function () { campo.type = 'password'; });
});
</script>
