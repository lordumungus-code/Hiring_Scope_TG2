.stats-section {

}

/* ──────────────────────────────────────────────

.stats-grid {

}

/* ──────────────────────────────────────────────
   CARD INDIVIDUAL
   ────────────────────────────────────────────── */
.stat-item {
    position: relative;

    align-items: center;

    padding: 1.5rem 1.4rem;

    overflow: hidden;
    isolation: isolate;
}

/* Faixa gradiente no topo (hover) */
.stat-item::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(90deg, #0b2b5c, #1a6d8f, #f59e0b);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 2;
}

}

}

    z-index: 1;
}

.stat-icon i {
    font-size: 1.35rem;
    color: #ffffff;
    transition: transform 0.4s ease;
}

.stat-icon-blue {
    background: linear-gradient(135deg, #0b2b5c, #1a6d8f);
    box-shadow: 0 8px 20px -6px rgba(11, 43, 92, 0.4);
}

.stat-icon-green {
    background: linear-gradient(135deg, #059669, #10b981);

}

}

}

}

.stat-info {

    z-index: 1;

}

}

.stat-label {

    color: #64748b;
    margin: 0;
    letter-spacing: 0.01em;

    line-height: 1.3;
}

/* ──────────────────────────────────────────────

.stat-glow {

    bottom: -40px;
    right: -40px;
    width: 120px;
    height: 120px;
    border-radius: 50%;
    filter: blur(30px);
    opacity: 0;
    transition: opacity 0.5s ease;
    pointer-events: none;
    z-index: 0;
}

.stat-glow-blue  { background: radial-gradient(circle, rgba(26, 109, 143, 0.5) 0%, transparent 70%); }

.stat-item:hover .stat-glow {
